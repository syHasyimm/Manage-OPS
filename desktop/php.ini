[PHP]
engine=On
short_open_tag=Off
precision=14
output_buffering=4096
serialize_precision=-1
max_execution_time=120
max_input_time=120
memory_limit=512M
error_reporting=E_ALL
display_errors=Off
display_startup_errors=Off
log_errors=On
post_max_size=256M
upload_max_filesize=256M
max_file_uploads=100
default_charset="UTF-8"
extension_dir="ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=xsl
extension=zip

[Date]
date.timezone=Asia/Jakarta

[Session]
session.use_strict_mode=1

[opcache]
opcache.enable=1
opcache.enable_cli=1
