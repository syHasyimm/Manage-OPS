<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPMB Desktop</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f7f4; color: #17351f; font-family: Arial, sans-serif; }
        main { text-align: center; padding: 32px; }
        .mark { width: 66px; height: 66px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 18px; background: #247343; color: #fff; font-size: 25px; font-weight: 800; }
        h1 { margin: 0 0 9px; font-size: 25px; }
        p { margin: 0; color: #657269; }
        .spinner { width: 28px; height: 28px; margin: 24px auto 0; border: 3px solid #cee0d4; border-top-color: #247343; border-radius: 50%; animation: spin .8s linear infinite; }
        #error { display: none; max-width: 520px; margin-top: 18px; padding: 15px; border: 1px solid #efc3bd; border-radius: 10px; background: #fff3f1; color: #8d2118; line-height: 1.5; text-align: left; }
        button { display: none; margin: 18px auto 0; padding: 10px 18px; border: 0; border-radius: 9px; background: #247343; color: #fff; font-weight: 700; cursor: pointer; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<main>
    <div class="mark">SP</div>
    <h1>Menyiapkan SPMB Desktop</h1>
    <p id="status">Memeriksa database dan menyalakan Laravel lokal…</p>
    <div class="spinner" id="spinner"></div>
    <div id="error"></div>
    <button id="retry" type="button">Coba lagi</button>
</main>
<script>
    window.showStartupError = function (message) {
        document.getElementById('status').textContent = 'Aplikasi belum dapat dimulai.';
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('error').textContent = message;
        document.getElementById('error').style.display = 'block';
        document.getElementById('retry').style.display = 'block';
    };

    document.getElementById('retry').addEventListener('click', async function () {
        this.style.display = 'none';
        document.getElementById('error').style.display = 'none';
        document.getElementById('spinner').style.display = 'block';
        document.getElementById('status').textContent = 'Mencoba menyalakan Laravel kembali…';
        await window.__TAURI__.core.invoke('retry_backend');
    });
</script>
</body>
</html>
